name: Universal Pages Deployer

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # Needed only if auto-committing generated index.html for Vercel/Cloudflare
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.x"

      - name: Prepare site payload (Smart Detect)
        id: site-detect
        env:
          REPO_NAME: ${{ github.repository }}
        run: |
          pip install markdown
          python3 - << 'EOF'
          import os
          import shutil
          import markdown

          repo_name = os.environ.get("REPO_NAME", "Repository").split("/")[-1]
          os.makedirs("_site", exist_ok=True)

          # Check if an index.html already exists and whether it's custom or auto-generated
          has_custom_site = False
          if os.path.exists("index.html"):
              with open("index.html", "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
                  if "<!-- auto-generated-from-readme -->" not in content:
                      has_custom_site = True

          if has_custom_site:
              print(f"::notice::[DETECTED CUSTOM SITE] Preserving custom index.html and assets for {repo_name}.")
              # Copy all root files and directories to _site, excluding git and build artifacts
              ignored = {".git", ".github", "_site", ".venv", "venv"}
              for item in os.listdir("."):
                  if item in ignored:
                      continue
                  src = item
                  dst = os.path.join("_site", item)
                  if os.path.isdir(src):
                      shutil.copytree(src, dst, dirs_exist_ok=True)
                  else:
                      shutil.copy2(src, dst)

              # Write output flag for downstream steps
              with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
                  gh_out.write("is_custom=true\n")

          else:
              print(f"::notice::[NO CUSTOM SITE] Generating static HTML from README.md for {repo_name}...")
              content = ""
              if os.path.exists("README.md"):
                  with open("README.md", "r", encoding="utf-8") as f:
                      content = f.read()
              else:
                  content = f"# {repo_name}\n\nAutomated documentation build."

              body = markdown.markdown(content, extensions=["tables", "fenced_code", "toc"])

              html = f"""<!DOCTYPE html>
          <!-- auto-generated-from-readme -->
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>{repo_name}</title>
            <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.8.1/github-markdown.min.css">
            <style>
              body {{
                box-sizing: border-box;
                min-width: 200px;
                max-width: 980px;
                margin: 0 auto;
                padding: 45px;
              }}
              @media (max-width: 767px) {{
                body {{
                  padding: 15px;
                }}
              }}
            </style>
          </head>
          <body class="markdown-body">
          {body}
          </body>
          </html>
          """
              with open("_site/index.html", "w", encoding="utf-8") as out:
                  out.write(html)

              # Write output flag for downstream steps
              with open(os.environ["GITHUB_OUTPUT"], "a") as gh_out:
                  gh_out.write("is_custom=false\n")
          EOF

          touch _site/.nojekyll

      # ONLY sync to root git for Vercel/Cloudflare if it was generated from README
      - name: Sync root index.html for Vercel/Cloudflare (only when auto-generated)
        if: steps.site-detect.outputs.is_custom == 'false'
        run: |
          cp _site/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html

          if ! git diff --staged --quiet; then
            git commit -m "docs: sync root index.html with README [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
